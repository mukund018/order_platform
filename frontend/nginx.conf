# Serves the built SPA and fronts the API on one origin.
#
# Everything the browser talks to is this server, which is why no Python service in the
# platform has a single line of CORS configuration: there is no cross-origin request to
# allow. It also means the ops console can reach support-service without that service
# being published to the internet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: any unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ------------------------------------------------------------------
    # The trailing slash on both sides is what strips the /api/<service> prefix.

    location /api/orders/ {
        proxy_pass http://orders:8001/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/inventory/ {
        proxy_pass http://inventory:8002/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/payments/ {
        proxy_pass http://payments:8003/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # support-service namespaces its endpoints under /support, so the prefix is swapped
    # rather than stripped.
    location /api/support/ {
        proxy_pass http://support:8004/support/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/prom/ {
        proxy_pass http://prometheus:9090/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
