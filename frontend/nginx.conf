# Serves the built SPA and fronts the API on one origin.
#
# Everything the browser talks to is this server, which is why no Python service in the
# platform has a single line of CORS configuration: there is no cross-origin request to
# allow. It also means the ops console can reach support-service without that service
# being published to the internet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Without a resolver, nginx looks each upstream name up once at
    # startup and caches the address for the life of the process - so the first
    # `docker compose up -d --build orders` gives that container a new IP and every
    # proxied request 502s against the old one until nginx is restarted too. That is a
    # daily event on this stack (every Phase 3 incident restarts a service), so the names
    # are re-resolved per request instead. `valid=10s` bounds how stale an answer can be.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: any unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ------------------------------------------------------------------
    #
    # Each block does the same two things: rewrite the path to drop the /api/<service>
    # prefix, then proxy to a name held in a variable.
    #
    # The variable is what forces re-resolution through the resolver above. It also turns
    # off nginx's automatic URI rewriting - a `proxy_pass` with a variable in it passes the
    # request URI through untouched - which is why each block needs an explicit `rewrite`
    # rather than relying on the trailing slash.

    location /api/orders/ {
        set $orders_upstream http://orders:8001;
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass $orders_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/inventory/ {
        set $inventory_upstream http://inventory:8002;
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass $inventory_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/payments/ {
        set $payments_upstream http://payments:8003;
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass $payments_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # support-service namespaces its endpoints under /support, so the prefix is swapped
    # rather than stripped.
    location /api/support/ {
        set $support_upstream http://support:8004;
        rewrite ^/api/support/(.*)$ /support/$1 break;
        proxy_pass $support_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/prom/ {
        set $prom_upstream http://prometheus:9090;
        rewrite ^/api/prom/(.*)$ /$1 break;
        proxy_pass $prom_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}
