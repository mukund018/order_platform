[project]
name = "support-service"
version = "0.1.0"
description = "Log search, service health and the incident board, served over HTTP for the ops console"
requires-python = ">=3.12"
dependencies = [
    "order-platform-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "debugpy>=1.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["db: needs a live postgres (set TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
